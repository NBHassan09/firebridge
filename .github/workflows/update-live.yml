name: Daily NASA data update
on:
  schedule:
    - cron: "17 2 * * *"      # 02:17 UTC daily (08:17 in Dhaka)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python pipeline/update_live.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain site/)" ]; then
            git config user.name "firebridge-bot"
            git config user.email "actions@users.noreply.github.com"
            git add site/live.json site/live_power.json
            git commit -m "Daily NASA data update"
            git push
          fi
